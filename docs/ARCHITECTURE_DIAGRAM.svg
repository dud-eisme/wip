<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f0f4f8; stroke: #2c5aa0; stroke-width: 2; }
      .title { font-size: 24px; font-weight: bold; fill: #1a3a52; }
      .subtitle { font-size: 14px; fill: #2c5aa0; font-weight: bold; }
      .text { font-size: 12px; fill: #333; }
      .component { fill: #e8f4f8; stroke: #0099cc; stroke-width: 2; }
      .model1 { fill: #fff4e6; stroke: #ff8c00; stroke-width: 2; }
      .model2 { fill: #e6f3ff; stroke: #0066cc; stroke-width: 2; }
      .model3 { fill: #f0e6ff; stroke: #6600cc; stroke-width: 2; }
      .connector { stroke: #666; stroke-width: 2; fill: none; }
      .arrow { stroke: #666; stroke-width: 2; fill: #666; }
      .label { font-size: 11px; fill: #666; font-weight: bold; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="40" class="title" text-anchor="middle">Unified CCTV Intelligence Platform - High-Level Architecture</text>

  <!-- Model 1: Registry & GIS -->
  <rect x="50" y="80" width="380" height="320" class="model1" rx="8"/>
  <text x="240" y="110" class="subtitle" text-anchor="middle">Model 1: CCTV Registry & GIS Foundation</text>
  
  <rect x="70" y="130" width="340" height="50" class="component" rx="4"/>
  <text x="240" y="155" class="text" text-anchor="middle">PostgreSQL + PostGIS Database</text>
  <text x="240" y="172" class="text" text-anchor="middle">Cameras, Users, Department RBAC</text>

  <rect x="70" y="195" width="340" height="50" class="component" rx="4"/>
  <text x="240" y="220" class="text" text-anchor="middle">FastAPI Backend (Port 8000)</text>
  <text x="240" y="237" class="text" text-anchor="middle">Authentication, Camera CRUD, Gap Analysis</text>

  <rect x="70" y="260" width="340" height="50" class="component" rx="4"/>
  <text x="240" y="285" class="text" text-anchor="middle">React Frontend (Port 5173)</text>
  <text x="240" y="302" class="text" text-anchor="middle">GIS Map, Camera List, Onboarding</text>

  <text x="70" y="330" class="label">Key Features:</text>
  <text x="90" y="348" class="text">• Department-scoped RBAC</text>
  <text x="90" y="363" class="text">• GIS mapping with PostGIS</text>
  <text x="90" y="378" class="text">• Gap analysis & analytics</text>

  <!-- Model 2: Live Feed & ANPR -->
  <rect x="510" y="80" width="380" height="320" class="model2" rx="8"/>
  <text x="700" y="110" class="subtitle" text-anchor="middle">Model 2: Live Feed Relay & ANPR</text>

  <rect x="530" y="130" width="340" height="50" class="component" rx="4"/>
  <text x="700" y="155" class="text" text-anchor="middle">FastAPI Backend (Port 8001)</text>
  <text x="700" y="172" class="text" text-anchor="middle">RTSP/MJPEG Stream Relay, YOLO+EasyOCR</text>

  <rect x="530" y="195" width="340" height="50" class="component" rx="4"/>
  <text x="700" y="220" class="text" text-anchor="middle">Camera Workers (Threads)</text>
  <text x="700" y="237" class="text" text-anchor="middle">Frame Decode, PTS Timing, Reconnection</text>

  <rect x="530" y="260" width="340" height="50" class="component" rx="4"/>
  <text x="700" y="285" class="text" text-anchor="middle">React Frontend (Port 5174)</text>
  <text x="700" y="302" class="text" text-anchor="middle">Video Wall, ANPR Events, Plate Search</text>

  <text x="530" y="330" class="label">Key Features:</text>
  <text x="550" y="348" class="text">• Live MJPEG streaming</text>
  <text x="550" y="363" class="text">• ANPR pipeline (50-source stress tested)</text>
  <text x="550" y="378" class="text">• Snapshot storage & retention</text>

  <!-- Model 3: Federation & Middleware -->
  <rect x="970" y="80" width="380" height="320" class="model3" rx="8"/>
  <text x="1160" y="110" class="subtitle" text-anchor="middle">Model 3: VMS Federation & Middleware</text>

  <rect x="990" y="130" width="340" height="50" class="component" rx="4"/>
  <text x="1160" y="155" class="text" text-anchor="middle">FastAPI Backend (Port 8002)</text>
  <text x="1160" y="172" class="text" text-anchor="middle">Adapter Pattern, Service Account Auth</text>

  <rect x="990" y="195" width="340" height="50" class="component" rx="4"/>
  <text x="1160" y="220" class="text" text-anchor="middle">Correlation Engine</text>
  <text x="1160" y="237" class="text" text-anchor="middle">Join Events + Camera Health, Reliability</text>

  <rect x="990" y="260" width="340" height="50" class="component" rx="4"/>
  <text x="1160" y="285" class="text" text-anchor="middle">React Frontend (Port 5175)</text>
  <text x="1160" y="302" class="text" text-anchor="middle">Adapter Status, Analytics Summary</text>

  <text x="990" y="330" class="label">Key Features:</text>
  <text x="1010" y="348" class="text">• Graceful federation degradation</text>
  <text x="1010" y="363" class="text">• Extensible adapter framework</text>
  <text x="1010" y="378" class="text">• Department + reliability filtering</text>

  <!-- Data Flow Section -->
  <line x1="50" y1="430" x2="1350" y2="430" class="connector" stroke-dasharray="5,5"/>
  
  <text x="700" y="465" class="subtitle" text-anchor="middle">Data Flow & Integration Points</text>

  <!-- Model 1 to Model 2 Connection -->
  <line x1="240" y1="400" x2="240" y2="480" class="connector"/>
  <polygon points="240,490 235,480 245,480" class="arrow"/>
  <text x="250" y="485" class="label">stream_endpoint</text>
  
  <line x1="430" y1="400" x2="430" y2="480" class="connector"/>
  <polygon points="430,490 425,480 435,480" class="arrow"/>
  <text x="440" y="485" class="label">same DB, SECRET_KEY</text>

  <!-- Model 1 to Model 3 Connection -->
  <line x1="240" y1="400" x2="1160" y2="480" class="connector"/>
  <polygon points="1160,490 1155,480 1165,480" class="arrow"/>
  <text x="650" y="425" class="label">GET /cameras (service account JWT)</text>

  <!-- Model 2 to Model 3 Connection -->
  <line x1="700" y1="400" x2="1160" y2="480" class="connector"/>
  <polygon points="1160,490 1155,480 1165,480" class="arrow"/>
  <text x="950" y="425" class="label">GET /anpr/events (same JWT)</text>

  <!-- Architecture Principles -->
  <text x="700" y="560" class="subtitle" text-anchor="middle">Architecture Principles</text>

  <rect x="50" y="580" width="650" height="120" class="box" rx="4"/>
  <text x="70" y="600" class="label">✓ Open, Modular, Scalable, Secure, Standards-Based</text>
  <text x="70" y="620" class="text">• Three independent FastAPI services (decoupled, can scale independently)</text>
  <text x="70" y="635" class="text">• Vendor-neutral adapter pattern enables integration with any VMS</text>
  <text x="70" y="650" class="text">• Department-scoped RBAC enforced across all models</text>
  <text x="70" y="665" class="text">• JWT authentication shared; no auth duplication</text>
  <text x="70" y="680" class="text">• PostGIS for spatial queries (real GIS, not app-side distance math)</text>

  <rect x="700" y="580" width="650" height="120" class="box" rx="4"/>
  <text x="720" y="600" class="label">✓ Streaming Best Practices Implemented</text>
  <text x="720" y="620" class="text">• RTSP/TCP enforced (UDP fails across NAT/firewalls)</text>
  <text x="720" y="635" class="text">• PTS-based timing (not arrival time) for accurate tracking</text>
  <text x="720" y="650" class="text">• Exponential backoff reconnection (2s–30s, not tight loops)</text>
  <text x="720" y="665" class="text">• Per-camera properties reading; adaptive batch sizing</text>
  <text x="720" y="680" class="text">• Graceful scene cut handling; state recovery on discontinuity</text>

  <!-- Footer -->
  <text x="700" y="720" class="subtitle" text-anchor="middle">Deployment & Operations</text>
  
  <rect x="50" y="740" width="1300" height="130" class="box" rx="4"/>
  <text x="70" y="760" class="label">Security: TLS/HTTPS • Rate Limiting • Audit Logging • CORS Hardening</text>
  <text x="70" y="778" class="text">Sizing: 7–8 cores, 14–16 GB RAM, ~560 GB storage for full deployment (per-camera costs documented)</text>
  <text x="70" y="796" class="text">Database: PostgreSQL 13+, PostGIS extension, optimized indexes, connection pooling</text>
  <text x="70" y="814" class="text">Monitoring: Prometheus metrics, Grafana dashboards, audit logging to JSON files</text>
  <text x="70" y="832" class="text">Backup: Daily PostgreSQL backups, 30-day point-in-time recovery, snapshot retention cleanup</text>
  <text x="70" y="850" class="text">Roadmap: Phase 1 (Security/Infrastructure Q1) → Phase 2 (Reliability Q2) → Phase 3 (Analytics Q3) → Phase 4 (Scale Q4+)</text>
</svg>