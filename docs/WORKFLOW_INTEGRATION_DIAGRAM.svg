<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f0f4f8; stroke: #2c5aa0; stroke-width: 2; }
      .title { font-size: 24px; font-weight: bold; fill: #1a3a52; }
      .subtitle { font-size: 14px; fill: #2c5aa0; font-weight: bold; }
      .text { font-size: 11px; fill: #333; }
      .process { fill: #e8f4f8; stroke: #0099cc; stroke-width: 2; }
      .decision { fill: #fff4e6; stroke: #ff8c00; stroke-width: 2; }
      .storage { fill: #f0e6ff; stroke: #6600cc; stroke-width: 2; }
      .connector { stroke: #666; stroke-width: 2; fill: none; }
      .arrow { stroke: #666; stroke-width: 2; fill: #666; }
      .label { font-size: 10px; fill: #666; font-weight: bold; }
      .flow-label { font-size: 9px; fill: #0066cc; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="35" class="title" text-anchor="middle">Workflow &amp; Integration Diagram - Data Flow Architecture</text>

  <!-- User & Authentication Flow (Top) -->
  <text x="700" y="70" class="subtitle" text-anchor="middle">1. Authentication &amp; User Onboarding</text>

  <rect x="80" y="90" width="120" height="60" class="process" rx="4"/>
  <text x="140" y="115" class="text" text-anchor="middle">User Login</text>
  <text x="140" y="130" class="text" text-anchor="middle">(Model 1)</text>

  <line x1="200" y1="120" x2="280" y2="120" class="connector"/>
  <polygon points="290,120 280,115 280,125" class="arrow"/>

  <rect x="280" y="90" width="120" height="60" class="storage" rx="4"/>
  <text x="340" y="115" class="text" text-anchor="middle">PostgreSQL</text>
  <text x="340" y="130" class="text" text-anchor="middle">users table</text>

  <line x1="400" y1="120" x2="480" y2="120" class="connector"/>
  <polygon points="490,120 480,115 480,125" class="arrow"/>
  <text x="435" y="105" class="flow-label">JWT issued</text>

  <rect x="480" y="90" width="120" height="60" class="process" rx="4"/>
  <text x="540" y="115" class="text" text-anchor="middle">Token Valid</text>
  <text x="540" y="130" class="text" text-anchor="middle">(All Models)</text>

  <!-- Camera Onboarding Branch -->
  <line x1="140" y1="150" x2="140" y2="190" class="connector"/>
  <polygon points="140,200 135,190 145,190" class="arrow"/>

  <rect x="60" y="200" width="160" height="50" class="decision" rx="4"/>
  <text x="140" y="225" class="text" text-anchor="middle">Onboarding Path?</text>

  <!-- Manual Entry -->
  <line x1="60" y1="230" x2="20" y2="280" class="connector"/>
  <polygon points="15,285 20,275 25,285" class="arrow"/>
  <text x="35" y="250" class="flow-label">Manual</text>

  <rect x="0" y="280" width="100" height="50" class="process" rx="4"/>
  <text x="50" y="305" class="text" text-anchor="middle">Form Entry</text>

  <!-- Bulk Upload -->
  <line x1="140" y1="200" x2="140" y2="180" class="connector"/>
  <polygon points="140,170 135,180 145,180" class="arrow"/>
  <text x="160" y="190" class="flow-label">Bulk CSV</text>

  <rect x="100" y="140" width="80" height="40" class="process" rx="4"/>
  <text x="140" y="165" class="text" text-anchor="middle">CSV Parse</text>

  <!-- Vendor API -->
  <line x1="220" y1="230" x2="280" y2="280" class="connector"/>
  <polygon points="285,290 275,285 280,275" class="arrow"/>
  <text x="240" y="250" class="flow-label">API Key</text>

  <rect x="260" y="280" width="100" height="50" class="process" rx="4"/>
  <text x="310" y="305" class="text" text-anchor="middle">Webhook Auth</text>

  <!-- All paths converge to Model 1 storage -->
  <line x1="50" y1="330" x2="310" y2="330" class="connector"/>
  <line x1="310" y1="330" x2="310" y2="380" class="connector"/>
  <polygon points="310,390 305,380 315,380" class="arrow"/>

  <rect x="260" y="390" width="100" height="50" class="storage" rx="4"/>
  <text x="310" y="410" class="text" text-anchor="middle">Model 1</text>
  <text x="310" y="425" class="text" text-anchor="middle">Cameras DB</text>

  <!-- Model 2 Integration -->
  <text x="700" y="70" class="subtitle" text-anchor="middle">2. Live Feed &amp; ANPR Pipeline</text>

  <rect x="600" y="90" width="120" height="60" class="process" rx="4"/>
  <text x="660" y="115" class="text" text-anchor="middle">Source Reg.</text>
  <text x="660" y="130" class="text" text-anchor="middle">(Model 2)</text>

  <line x1="600" y1="120" x2="520" y2="120" class="connector"/>
  <polygon points="510,120 520,115 520,125" class="arrow"/>
  <text x="550" y="105" class="flow-label">camera_id + RTSP URL</text>

  <!-- Camera Worker Thread -->
  <line x1="660" y1="150" x2="660" y2="210" class="connector"/>
  <polygon points="660,220 655,210 665,210" class="arrow"/>

  <rect x="600" y="220" width="120" height="60" class="process" rx="4"/>
  <text x="660" y="240" class="text" text-anchor="middle">Camera Worker</text>
  <text x="660" y="255" class="text" text-anchor="middle">(Thread/Process)</text>

  <line x1="660" y1="280" x2="660" y2="340" class="connector"/>
  <polygon points="660,350 655,340 665,340" class="arrow"/>

  <rect x="600" y="350" width="120" height="60" class="process" rx="4"/>
  <text x="660" y="370" class="text" text-anchor="middle">Frame Decode</text>
  <text x="660" y="385" class="text" text-anchor="middle">(PTS Timing)</text>

  <line x1="720" y1="380" x2="800" y2="380" class="connector"/>
  <polygon points="810,380 800,375 800,385" class="arrow"/>
  <text x="750" y="370" class="flow-label">MJPEG stream</text>

  <rect x="800" y="350" width="120" height="60" class="process" rx="4"/>
  <text x="860" y="375" class="text" text-anchor="middle">MJPEG Relay</text>

  <!-- ANPR Pipeline Branch -->
  <line x1="660" y1="410" x2="660" y2="460" class="connector"/>
  <polygon points="660,470 655,460 665,460" class="arrow"/>
  <text x="680" y="445" class="flow-label">Optional: run ANPR</text>

  <rect x="600" y="470" width="120" height="60" class="process" rx="4"/>
  <text x="660" y="490" class="text" text-anchor="middle">YOLO Detection</text>
  <text x="660" y="505" class="text" text-anchor="middle">(Object Detect)</text>

  <line x1="720" y1="500" x2="800" y2="500" class="connector"/>
  <polygon points="810,500 800,495 800,505" class="arrow"/>

  <rect x="800" y="470" width="120" height="60" class="process" rx="4"/>
  <text x="860" y="490" class="text" text-anchor="middle">EasyOCR</text>
  <text x="860" y="505" class="text" text-anchor="middle">(Text Extract)</text>

  <line x1="920" y1="500" x2="980" y2="500" class="connector"/>
  <polygon points="990,500 980,495 980,505" class="arrow"/>

  <rect x="980" y="470" width="120" height="60" class="storage" rx="4"/>
  <text x="1040" y="490" class="text" text-anchor="middle">anpr_events</text>
  <text x="1040" y="505" class="text" text-anchor="middle">+ snapshots</text>

  <!-- Model 3 Federation -->
  <text x="700" y="570" class="subtitle" text-anchor="middle">3. VMS Federation &amp; Correlation (Model 3)</text>

  <line x1="310" y1="440" x2="310" y2="610" class="connector"/>
  <polygon points="310,620 305,610 315,610" class="arrow"/>
  <text x="280" y="520" class="flow-label">GET /cameras</text>

  <line x1="1040" y1="530" x2="1040" y2="610" class="connector"/>
  <polygon points="1040,620 1035,610 1045,610" class="arrow"/>
  <text x="1060" y="570" class="flow-label">GET /anpr/events</text>

  <rect x="280" y="620" width="140" height="50" class="process" rx="4"/>
  <text x="350" y="645" class="text" text-anchor="middle">Model 1 Adapter</text>

  <line x1="420" y1="645" x2="520" y2="645" class="connector"/>
  <polygon points="530,645 520,640 520,650" class="arrow"/>

  <rect x="520" y="620" width="140" height="50" class="process" rx="4"/>
  <text x="590" y="645" class="text" text-anchor="middle">Correlation Engine</text>

  <line x1="660" y1="645" x2="760" y2="645" class="connector"/>
  <polygon points="770,645 760,640 760,650" class="arrow"/>

  <rect x="760" y="620" width="140" height="50" class="process" rx="4"/>
  <text x="830" y="645" class="text" text-anchor="middle">Model 2 Adapter</text>

  <line x1="900" y1="645" x2="970" y2="645" class="connector"/>
  <polygon points="980,645 970,640 970,650" class="arrow"/>

  <line x1="1040" y1="620" x2="1040" y2="700" class="connector"/>
  <polygon points="1040,710 1035,700 1045,700" class="arrow"/>

  <!-- Correlation Output -->
  <rect x="960" y="710" width="160" height="60" class="storage" rx="4"/>
  <text x="1040" y="735" class="text" text-anchor="middle">Correlated Events</text>
  <text x="1040" y="750" class="text" text-anchor="middle">(dept + health + reliability)</text>

  <!-- Final Output -->
  <line x1="1040" y1="770" x2="1040" y2="820" class="connector"/>
  <polygon points="1040,830 1035,820 1045,820" class="arrow"/>

  <rect x="960" y="830" width="160" height="50" class="process" rx="4"/>
  <text x="1040" y="855" class="text" text-anchor="middle">Frontend Display</text>

  <!-- Decision Point for Filtering -->
  <line x1="590" y1="670" x2="590" y2="720" class="connector"/>
  <polygon points="590,730 585,720 595,720" class="arrow"/>

  <rect x="520" y="730" width="140" height="60" class="decision" rx="4"/>
  <text x="590" y="750" class="text" text-anchor="middle">Filter by:</text>
  <text x="590" y="765" class="text" text-anchor="middle">• Department</text>
  <text x="590" y="780" class="text" text-anchor="middle">• Reliability</text>

  <!-- Error Handling & Monitoring -->
  <text x="700" y="570" class="subtitle" text-anchor="middle">4. Error Handling &amp; Monitoring</text>

  <rect x="50" y="710" width="140" height="60" class="decision" rx="4"/>
  <text x="120" y="735" class="text" text-anchor="middle">Stream</text>
  <text x="120" y="750" class="text" text-anchor="middle">Disconnected?</text>

  <line x1="100" y1="770" x2="60" y2="820" class="connector"/>
  <polygon points="55,830 60,820 50,820" class="arrow"/>
  <text x="70" y="800" class="flow-label">YES</text>

  <rect x="10" y="830" width="100" height="50" class="process" rx="4"/>
  <text x="60" y="850" class="text" text-anchor="middle">Backoff</text>
  <text x="60" y="865" class="text" text-anchor="middle">Reconnect</text>

  <line x1="190" y1="740" x2="250" y2="820" class="connector"/>
  <polygon points="255,830 245,825 250,815" class="arrow"/>
  <text x="210" y="780" class="flow-label">NO</text>

  <rect x="220" y="830" width="100" height="50" class="process" rx="4"/>
  <text x="270" y="850" class="text" text-anchor="middle">Continue</text>
  <text x="270" y="865" class="text" text-anchor="middle">Processing</text>

  <!-- Audit & Metrics -->
  <rect x="350" y="830" width="140" height="50" class="storage" rx="4"/>
  <text x="420" y="850" class="text" text-anchor="middle">Audit Logs</text>
  <text x="420" y="865" class="text" text-anchor="middle">(JSON, all models)</text>

  <rect x="530" y="830" width="140" height="50" class="storage" rx="4"/>
  <text x="600" y="850" class="text" text-anchor="middle">Prometheus Metrics</text>
  <text x="600" y="865" class="text" text-anchor="middle">(CPU, frames, events)</text>

  <!-- Legend -->
  <text x="50" y="920" class="label">Legend:</text>
  <rect x="130" y="905" width="15" height="15" class="process" rx="2"/>
  <text x="155" y="917" class="text">Process</text>

  <rect x="280" y="905" width="15" height="15" class="storage" rx="2"/>
  <text x="305" y="917" class="text">Storage/Data</text>

  <rect x="450" y="905" width="15" height="15" class="decision" rx="2"/>
  <text x="475" y="917" class="text">Decision</text>

  <line x1="600" y1="912" x2="625" y2="912" class="connector"/>
  <text x="635" y="917" class="text">Data Flow</text>
</svg>
