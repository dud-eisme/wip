<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f0f4f8; stroke: #2c5aa0; stroke-width: 2; }
      .title { font-size: 24px; font-weight: bold; fill: #1a3a52; }
      .subtitle { font-size: 15px; fill: #2c5aa0; font-weight: bold; }
      .section-bg { fill: #fcfcfc; stroke: #dcdcdc; stroke-width: 1; stroke-dasharray: 4,4; }
      .text { font-size: 11px; fill: #333; }
      .process { fill: #e8f4f8; stroke: #0099cc; stroke-width: 2; }
      .decision { fill: #fff4e6; stroke: #ff8c00; stroke-width: 2; }
      .storage { fill: #f0e6ff; stroke: #6600cc; stroke-width: 2; }
      .connector { stroke: #666; stroke-width: 2; fill: none; }
      .arrow { stroke: #666; stroke-width: 2; fill: #666; }
      .label { font-size: 11px; fill: #444; font-weight: bold; }
      .flow-label { font-size: 10px; fill: #0066cc; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="35" class="title" text-anchor="middle">Workflow &amp; Integration Diagram - Data Flow Architecture</text>

  <!-- SECTION 1: AUTH & ONBOARDING -->
  <rect x="30" y="60" width="410" height="420" class="section-bg" rx="6"/>
  <text x="235" y="85" class="subtitle" text-anchor="middle">1. Authentication &amp; User Onboarding</text>

  <!-- User Login -> Auth DB -> JWT Token -->
  <rect x="50" y="105" width="100" height="50" class="process" rx="4"/>
  <text x="100" y="128" class="text" text-anchor="middle">User Login</text>
  <text x="100" y="142" class="text" text-anchor="middle">(Model 1)</text>

  <line x1="150" y1="130" x2="180" y2="130" class="connector"/>
  <polygon points="190,130 180,125 180,135" class="arrow"/>

  <rect x="190" y="105" width="100" height="50" class="storage" rx="4"/>
  <text x="240" y="128" class="text" text-anchor="middle">PostgreSQL</text>
  <text x="240" y="142" class="text" text-anchor="middle">users table</text>

  <line x1="290" y1="130" x2="320" y2="130" class="connector"/>
  <polygon points="330,130 320,125 320,135" class="arrow"/>

  <rect x="330" y="105" width="90" height="50" class="process" rx="4"/>
  <text x="375" y="128" class="text" text-anchor="middle">Token Valid</text>
  <text x="375" y="142" class="text" text-anchor="middle">(JWT Auth)</text>

  <!-- Camera Onboarding Paths -->
  <line x1="100" y1="155" x2="100" y2="185" class="connector"/>
  <polygon points="100,195 95,185 105,185" class="arrow"/>

  <rect x="40" y="195" width="120" height="45" class="decision" rx="4"/>
  <text x="100" y="222" class="text" text-anchor="middle">Onboarding Path?</text>

  <!-- Paths: Manual, Bulk CSV, Webhook API -->
  <line x1="60" y1="240" x2="60" y2="270" class="connector"/>
  <polygon points="60,280 55,270 65,270" class="arrow"/>
  <text x="35" y="260" class="flow-label">Manual</text>
  <rect x="20" y="280" width="80" height="40" class="process" rx="4"/>
  <text x="60" y="304" class="text" text-anchor="middle">Form Entry</text>

  <line x1="100" y1="240" x2="100" y2="270" class="connector"/>
  <polygon points="100,280 95,270 105,270" class="arrow"/>
  <text x="105" y="260" class="flow-label">Bulk</text>
  <rect x="110" y="280" width="80" height="40" class="process" rx="4"/>
  <text x="150" y="304" class="text" text-anchor="middle">CSV Parse</text>

  <line x1="140" y1="240" x2="220" y2="270" class="connector"/>
  <polygon points="225,275 215,270 220,260" class="arrow"/>
  <text x="180" y="250" class="flow-label">API Key</text>
  <rect x="200" y="280" width="90" height="40" class="process" rx="4"/>
  <text x="245" y="304" class="text" text-anchor="middle">Webhook Auth</text>

  <!-- Converge to Model 1 Cameras DB -->
  <line x1="60" y1="320" x2="60" y2="350" class="connector"/>
  <line x1="150" y1="320" x2="150" y2="350" class="connector"/>
  <line x1="245" y1="320" x2="245" y2="350" class="connector"/>
  <line x1="60" y1="350" x2="245" y2="350" class="connector"/>

  <line x1="150" y1="350" x2="150" y2="385" class="connector"/>
  <polygon points="150,395 145,385 155,385" class="arrow"/>

  <rect x="90" y="395" width="120" height="50" class="storage" rx="4"/>
  <text x="150" y="418" class="text" text-anchor="middle">Model 1 DB</text>
  <text x="150" y="432" class="text" text-anchor="middle">(Cameras &amp; Spatial)</text>

  <!-- SECTION 2: LIVE FEED & ANPR PIPELINE -->
  <rect x="460" y="60" width="910" height="420" class="section-bg" rx="6"/>
  <text x="915" y="85" class="subtitle" text-anchor="middle">2. Live Feed &amp; ANPR Pipeline</text>

  <rect x="480" y="105" width="110" height="50" class="process" rx="4"/>
  <text x="535" y="128" class="text" text-anchor="middle">Source Reg.</text>
  <text x="535" y="142" class="text" text-anchor="middle">(Model 2)</text>

  <line x1="590" y1="130" x2="620" y2="130" class="connector"/>
  <polygon points="630,130 620,125 620,135" class="arrow"/>

  <rect x="630" y="105" width="120" height="50" class="process" rx="4"/>
  <text x="690" y="128" class="text" text-anchor="middle">Camera Worker</text>
  <text x="690" y="142" class="text" text-anchor="middle">(RTSP/TCP Decode)</text>

  <line x1="750" y1="130" x2="780" y2="130" class="connector"/>
  <polygon points="790,130 780,125 780,135" class="arrow"/>

  <rect x="790" y="105" width="110" height="50" class="process" rx="4"/>
  <text x="845" y="128" class="text" text-anchor="middle">Frame Decode</text>
  <text x="845" y="142" class="text" text-anchor="middle">(PTS Timing)</text>

  <!-- MJPEG Branch -->
  <line x1="900" y1="130" x2="940" y2="130" class="connector"/>
  <polygon points="950,130 940,125 940,135" class="arrow"/>
  
  <rect x="950" y="105" width="110" height="50" class="process" rx="4"/>
  <text x="1005" y="134" class="text" text-anchor="middle">MJPEG Relay</text>

  <!-- ANPR Branch -->
  <line x1="845" y1="155" x2="845" y2="200" class="connector"/>
  <polygon points="845,210 840,200 850,200" class="arrow"/>
  <text x="855" y="185" class="flow-label">Frame Queue</text>

  <rect x="780" y="210" width="130" height="50" class="process" rx="4"/>
  <text x="845" y="233" class="text" text-anchor="middle">YOLO Object Detect</text>
  <text x="845" y="247" class="text" text-anchor="middle">(Plate Localization)</text>

  <line x1="910" y1="235" x2="940" y2="235" class="connector"/>
  <polygon points="950,235 940,230 940,240" class="arrow"/>

  <rect x="950" y="210" width="120" height="50" class="process" rx="4"/>
  <text x="1010" y="233" class="text" text-anchor="middle">EasyOCR</text>
  <text x="1010" y="247" class="text" text-anchor="middle">(Text Extraction)</text>

  <line x1="1070" y1="235" x2="1100" y2="235" class="connector"/>
  <polygon points="1110,235 1100,230 1100,240" class="arrow"/>

  <rect x="1110" y="210" width="130" height="50" class="storage" rx="4"/>
  <text x="1175" y="233" class="text" text-anchor="middle">anpr_events</text>
  <text x="1175" y="247" class="text" text-anchor="middle">+ Snapshots DB</text>

  <!-- SECTION 3: VMS FEDERATION & MIDDLEWARE -->
  <rect x="30" y="500" width="1340" height="230" class="section-bg" rx="6"/>
  <text x="700" y="525" class="subtitle" text-anchor="middle">3. VMS Federation &amp; Correlation (Model 3)</text>

  <!-- Connections from Model 1 & Model 2 into Model 3 -->
  <line x1="150" y1="445" x2="150" y2="560" class="connector"/>
  <polygon points="150,570 145,560 155,560" class="arrow"/>
  <text x="160" y="480" class="flow-label">GET /cameras</text>

  <line x1="1175" y1="260" x2="1175" y2="560" class="connector"/>
  <polygon points="1175,570 1170,560 1180,560" class="arrow"/>
  <text x="1100" y="480" class="flow-label">GET /anpr/events</text>

  <rect x="80" y="570" width="140" height="50" class="process" rx="4"/>
  <text x="150" y="599" class="text" text-anchor="middle">Model 1 Adapter</text>

  <rect x="1105" y="570" width="140" height="50" class="process" rx="4"/>
  <text x="1175" y="599" class="text" text-anchor="middle">Model 2 Adapter</text>

  <line x1="220" y1="595" x2="350" y2="595" class="connector"/>
  <polygon points="360,595 350,590 350,600" class="arrow"/>

  <line x1="1105" y1="595" x2="970" y2="595" class="connector"/>
  <polygon points="960,595 970,590 970,600" class="arrow"/>

  <!-- Correlation Core -->
  <rect x="360" y="565" width="600" height="60" class="process" rx="4"/>
  <text x="660" y="590" class="label" text-anchor="middle">Correlation Engine &amp; Aggregator</text>
  <text x="660" y="610" class="text" text-anchor="middle">Joins camera metadata + health status + spatial coordinates + ANPR event streams</text>

  <line x1="660" y1="625" x2="660" y2="650" class="connector"/>
  <polygon points="660,660 655,650 665,650" class="arrow"/>

  <rect x="560" y="660" width="200" height="50" class="storage" rx="4"/>
  <text x="660" y="683" class="text" text-anchor="middle">Correlated Event Feed</text>
  <text x="660" y="697" class="text" text-anchor="middle">(Dept + Health + Reliability Filtered)</text>

  <!-- SECTION 4: ERROR HANDLING & MONITORING -->
  <rect x="30" y="750" width="1340" height="170" class="section-bg" rx="6"/>
  <text x="700" y="775" class="subtitle" text-anchor="middle">4. Resilience, Monitoring &amp; Logging</text>

  <!-- Stream Reconnection Loop -->
  <rect x="60" y="800" width="140" height="50" class="decision" rx="4"/>
  <text x="130" y="823" class="text" text-anchor="middle">Stream Interrupted?</text>
  <text x="130" y="837" class="text" text-anchor="middle">(RTSP Loss / Drop)</text>

  <line x1="200" y1="825" x2="250" y2="825" class="connector"/>
  <polygon points="260,825 250,820 250,830" class="arrow"/>
  <text x="225" y="815" class="flow-label">YES</text>

  <rect x="260" y="800" width="150" height="50" class="process" rx="4"/>
  <text x="335" y="823" class="text" text-anchor="middle">Exponential Backoff</text>
  <text x="335" y="837" class="text" text-anchor="middle">(2s to 30s Retry Loop)</text>

  <!-- Logging / Audit / Metrics -->
  <rect x="520" y="800" width="160" height="50" class="storage" rx="4"/>
  <text x="600" y="823" class="text" text-anchor="middle">Audit Logging</text>
  <text x="600" y="837" class="text" text-anchor="middle">(JSON Files, Multi-Tenant)</text>

  <rect x="720" y="800" width="160" height="50" class="storage" rx="4"/>
  <text x="800" y="823" class="text" text-anchor="middle">Prometheus Metrics</text>
  <text x="800" y="837" class="text" text-anchor="middle">(CPU, Frames, Drops, Latency)</text>

  <rect x="920" y="800" width="160" height="50" class="process" rx="4"/>
  <text x="1000" y="823" class="text" text-anchor="middle">Grafana Dashboards</text>
  <text x="1000" y="837" class="text" text-anchor="middle">(Real-time Telemetry)</text>

  <!-- LEGEND -->
  <rect x="30" y="940" width="1340" height="40" class="box" rx="4"/>
  <text x="50" y="964" class="label">Legend:</text>
  
  <rect x="120" y="952" width="15" height="15" class="process" rx="2"/>
  <text x="142" y="964" class="text">Microservice / Process</text>

  <rect x="300" y="952" width="15" height="15" class="storage" rx="2"/>
  <text x="322" y="964" class="text">Database / State Storage</text>

  <rect x="490" y="952" width="15" height="15" class="decision" rx="2"/>
  <text x="512" y="964" class="text">Decision / Pipeline Check</text>

  <line x1="680" y1="960" x2="710" y2="960" class="connector"/>
  <polygon points="720,960 710,955 710,965" class="arrow"/>
  <text x="730" y="964" class="text">Data / API Call Flow</text>
</svg>
